<style>
*{
    box-sizing:border-box;

}

:root{
    --bg:#05070b;
    --panel:#0b1018;
    --panel2:#101722;
    --line:#202b3a;
    --text:#eef4ff;

body{

button{

.my-label{

}

.actions{

}

function log(message, type=""){
    const div = document.createElement("div");

    div.className =
        "log " + type;

    const time =
        new Date().toLocaleTimeString();

    div.textContent =
        `[${time}] ${message}`;

    consoleBox.appendChild(div);

    consoleBox.scrollTop =
        consoleBox.scrollHeight;

    console.log(message);
}


/* ============================================================
   SUPABASE
============================================================ */

async function testSupabaseConnection(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/health",
                {
                    headers:{
                        apikey:SUPABASE_KEY,
                        Authorization:
                            "Bearer " + SUPABASE_KEY
                    }
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        log(
            "SUPABASE: conexión correcta",
            "success"
        );

    }catch(error){

        log(
            "ERROR SUPABASE: " +
            error.message,
            "error"
        );

    }
}


/* ============================================================
   AUTH
============================================================ */

async function initializeAuth(){

    try{

        let result =
            await supabaseClient.auth.getSession();

        if(
            !result.data.session
        ){

            const authResult =
                await supabaseClient.auth.signInAnonymously();

            if(authResult.error){

                throw authResult.error;

            }

            currentUser =
                authResult.data.user;

        }else{

            currentUser =
                result.data.session.user;

        }

        if(!currentUser){

            throw new Error(
                "No se obtuvo usuario"
            );

        }

        log(
            "AUTH: usuario conectado",
            "success"
        );

        await loadOrCreateNexusNumber();

    }catch(error){

        log(
            "ERROR AUTH: " +
            error.message,
            "error"
        );

        statusText.textContent =
            "ERROR";

    }
}


/* ============================================================
   NÚMERO NEXUS
============================================================ */

function generateNexusNumber(){

    return String(
        Math.floor(
            10000 +
            Math.random() * 90000
        )
    );

}


async function loadOrCreateNexusNumber(){

    try{

        const result =
            await supabaseClient
            .from("nexus_users")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();

        if(result.error){

            throw result.error;

        }

        if(result.data){

            myNumber =
                result.data.nexus_number;

            await updatePresence();

        }else{

            let created = false;

            for(let i=0;i<20;i++){

                const generated =
                    generateNexusNumber();

                const insertResult =
                    await supabaseClient
                    .from("nexus_users")
                    .insert({
                        id:currentUser.id,
                        nexus_number:generated,
                        online:true,
                        last_seen:new Date().toISOString()
                    })
                    .select()
                    .single();

                if(!insertResult.error){

                    myNumber =
                        generated;

                    created = true;

                    break;

                }

            }

            if(!created){

                throw new Error(
                    "No se pudo generar un número NEXUS"
                );

            }

        }

        myNumberElement.textContent =
            myNumber;

        callButton.disabled =
            false;

        statusDot.classList.add("online");

        statusText.textContent =
            "ONLINE";

        log(
            "NÚMERO NEXUS: " + myNumber,
            "success"
        );

        await createSignalingChannel();

    }catch(error){

        log(
            "ERROR NÚMERO: " +
            error.message,
            "error"
        );

    }

}


async function updatePresence(){

    if(!currentUser || !myNumber)
        return;

    await supabaseClient

/* ============================================================
   CANAL DE SEÑALIZACIÓN ÚNICO
============================================================ */

async function createSignalingChannel(){

    if(signalingChannel)
        return;

    signalingChannel =
        supabaseClient.channel(
            "nexus-signaling",
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );

    signalingChannel
        .on(
            "broadcast",
            {
                event:"signal"
            },
            ({payload}) => {

                handleSignal(payload);

            }
        );

    const result =
        await signalingChannel.subscribe(
            status => {

                log(
                    "NEXUS CHANNEL: " +
                    status
                );

                if(status === "SUBSCRIBED"){

                    log(
                        "📡 SEÑALIZACIÓN LISTA",
                        "success"
                    );

                }

            }
        );

}


/* ============================================================
   SEÑALES
============================================================ */

async function sendSignal(payload){

    if(!signalingChannel){

        log(
            "ERROR: canal de señalización no disponible",
            "error"
        );

        return;

    }

    const finalPayload = {

        ...payload,

        from:myNumber,

        to:destination

    };

    try{

        await signalingChannel.send({

            type:"broadcast",

            event:"signal",

            payload:finalPayload

        });

        log(
            "📤 SEÑAL ENVIADA: " +
            payload.type
        );

    }catch(error){

        log(
            "ERROR SEÑAL: " +
            error.message,
            "error"
        );

    }

}


async function handleSignal(payload){

    if(!payload)
        return;

    if(payload.to !== myNumber)
        return;

    log(
        "📡 SEÑAL RECIBIDA: " +
        payload.type,
        "info"
    );

    switch(payload.type){

        case "incoming_call":

            await handleIncomingCall(payload);

            break;

        case "answer":

            await handleAnswer(payload);

            break;

        case "ice":

            await handleRemoteIce(payload);

            break;

        case "reject":

            handleReject();

            break;

        case "hangup":

            handleRemoteHangup();

            break;

    }

}

function pressKey(key){

    if(key !== "*" && key !== "#"){

        if(
            dialDisplay.dataset.value?.length >= 5
        )
            return;

        const current =
            dialDisplay.dataset.value || "";

        dialDisplay.dataset.value =
            current + key;

        updateDialDisplay();

    }

}


function updateDialDisplay(){

    const value =
        dialDisplay.dataset.value || "";

    if(!value){

        dialDisplay.textContent =
            "NÚMERO";

        dialDisplay.classList.add("empty");

    }else{

        dialDisplay.textContent =
            value;

        dialDisplay.classList.remove("empty");

    }

}


function backspace(){

    const value =
        dialDisplay.dataset.value || "";

    dialDisplay.dataset.value =
        value.slice(0,-1);

    updateDialDisplay();

}


function clearDial(){

    dialDisplay.dataset.value =

    updateDialDisplay();

}


/* ============================================================
   LLAMAR
============================================================ */

async function startCall(){

    const number =
        dialDisplay.dataset.value || "";

    if(!/^\d{5}$/.test(number)){

        log(
            "Introduce un número NEXUS de 5 dígitos",
            "error"
        );

        return;

    }

    if(number === myNumber){

        log(
            "No puedes llamarte a ti mismo. La humanidad ya inventó suficiente autocomunicación.",
            "error"
        );

        return;

    }

    destination =
        number;

    callMode =
        "voice";

    showOutgoingCall();

    try{

        await prepareLocalMedia(false);

        await createPeerConnection();

        const offer =
            await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );

        await sendSignal({

            type:"incoming_call",

            offer:offer,

            mode:"voice"

        });

        log(
            "📞 LLAMADA ENVIADA A " +
            destination,
            "success"
        );

    }catch(error){

        log(
            "ERROR STARTCALL: " +
            error.message,
            "error"
        );

        cleanupCall();

    }

}

async function handleIncomingCall(payload){

    if(callActive){

        log(
            "Llamada entrante ignorada: ya estás en una llamada"
        );

        return;

    }

    destination =
        payload.from;

    incomingOffer =
        payload.offer;

    callMode =
        payload.mode === "video"
            ? "video"
            : "voice";

    callerNumber.textContent =
        destination;

    callType.textContent =
        callMode === "video"
            ? "VIDEOLLAMADA ENTRANTE"
            : "LLAMADA ENTRANTE";

    callState.textContent =
        "LLAMADA ENTRANTE";

    callDescription.textContent =
        callMode === "video"
            ? "Videollamada NEXUS"
            : "Llamada de voz NEXUS";

    incomingButtons.style.display =
        "grid";

    callScreen.classList.add("show");

    log(
        "📞 LLAMADA ENTRANTE DE " +
        destination,
        "success"
    );

}

async function acceptIncoming(){

    incomingButtons.style.display =
        "none";

    callState.textContent =
        "CONECTANDO...";

    try{

        await prepareLocalMedia(
            callMode === "video"
        );

        await createPeerConnection();

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                incomingOffer
            )
        );

        remoteDescriptionSet =
            true;

        await flushPendingIce();

        const answer =
            await peerConnection.createAnswer();

        await peerConnection.setLocalDescription(
            answer
        );

        await sendSignal({

            type:"answer",

            answer:answer,

            mode:callMode

        });

        callScreen.classList.remove("show");

        );

/* ============================================================
   WEBRTC
============================================================ */

async function createPeerConnection(){

    if(peerConnection)
        return;

    remoteDescriptionSet =
        false;

    pendingIceCandidates =
        [];

    peerConnection =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]

        });


    peerConnection.onicecandidate =
        async event => {

            if(
                event.candidate
            ){

                await sendSignal({

                    type:"ice",

                    candidate:
                        event.candidate

                });

            }

        };


    peerConnection.ontrack =
        event => {

            log(
                "🔊 AUDIO/VIDEO REMOTO RECIBIDO",
                "success"
            );

            if(!remoteStream){

                remoteStream =
                    new MediaStream();

            }

            event.streams[0]
                ?.getTracks()
                .forEach(track => {

                    const exists =
                        remoteStream
                        .getTracks()
                        .some(
                            t => t.id === track.id
                        );

                    if(!exists){

                        remoteStream.addTrack(track);

                    }

                });

            const audioTracks =
                remoteStream.getAudioTracks();

            const videoTracks =
                remoteStream.getVideoTracks();

            if(audioTracks.length){

                remoteAudio.srcObject =
                    remoteStream;

                remoteAudio.play()
                    .then(() => {

                        audioUnlock.classList.remove(
                            "show"
                        );

                    })
                    .catch(() => {

                        audioUnlock.classList.add(
                            "show"
                        );

                    });

            }

            if(videoTracks.length){

                remoteVideo.srcObject =
                    remoteStream;

                remoteVideo.classList.add(
                    "visible"
                );

                voiceAvatar.style.display =
                    "none";

            }

        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;

            log(
                "🔗 CONNECTION: " +
                state,
                state === "connected"
                    ? "success"
                    : ""
            );

            connectionText.textContent =
                "CONEXIÓN: " +
                state.toUpperCase();

            activeStatus.textContent =
                state === "connected"
                    ? formatCallTime()
                    : state.toUpperCase();

            if(
                state === "connected"
            ){

                startCallTimer();

            }

            if(
                state === "failed" ||
                state === "closed"
            ){

                if(state === "failed"){

                    log(
                        "La conexión WebRTC falló. Puede requerir TURN en algunas redes.",
                        "error"
                    );

                }

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            const state =
                peerConnection
                .iceConnectionState;

            connectionText.textContent =
                "ICE: " +
                state.toUpperCase();

            log(
                "🧊 ICE: " +
                state
            );

            document.getElementById(
                "infoIce"
            ).textContent =
                state;

        };


    peerConnection.onicegatheringstatechange =
        () => {

            log(
                "🧊 ICE GATHERING: " +
                peerConnection.iceGatheringState
            );

        };


    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });

    }

}


/* ============================================================
   ICE
============================================================ */

async function handleRemoteIce(payload){

    if(
        !payload.candidate
    )
        return;

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        pendingIceCandidates.push(
            payload.candidate
        );

        log(
            "🧊 ICE GUARDADO EN COLA"
        );

        return;

    }

    try{

        await peerConnection.addIceCandidate(
            new RTCIceCandidate(
                payload.candidate
            )
        );

        log(
            "🧊 ICE REMOTO AÑADIDO",
            "success"
        );

    }catch(error){

        log(
            "ERROR ICE REMOTO: " +
            error.message,
            "error"
        );

    }

}


async function flushPendingIce(){

    if(
        !peerConnection ||
        !remoteDescriptionSet
    )
        return;

    for(
        const candidate
        of pendingIceCandidates
    ){

        try{

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(candidate)
            );

            log(
                "🧊 ICE DE COLA AÑADIDO"
            );

        }catch(error){

            log(
                "ERROR ICE COLA: " +
                error.message,
                "error"
            );

        }

    }

    pendingIceCandidates =
        [];

}


/* ============================================================
   MICRÓFONO / CÁMARA
============================================================ */

async function prepareLocalMedia(video=false){

    if(localStream){

        if(video){

            const videoTrack =
                localStream
                .getVideoTracks()[0];

            if(videoTrack){

                videoTrack.enabled =
                    true;

                cameraEnabled =
                    true;

                return;

            }

        }else{

            return;

        }

    }

    localStream =
        await navigator.mediaDevices.getUserMedia({

            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            },

            video:video
                ? {
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    },
                    facingMode:"user"
                }
                : false

        });

    microphoneEnabled =
        true;

    cameraEnabled =
        video;

    if(video){

        localVideo.srcObject =
            localStream;

        localVideo.classList.add(
            "visible"
        );

    }

    log(
        video
            ? "🎥 CÁMARA + MICRÓFONO ACTIVADOS"
            : "🎙️ MICRÓFONO ACTIVADO",
        "success"
    );

}


async function toggleMicrophone(){

    if(!localStream){

        try{

            await prepareLocalMedia(false);

        }catch(error){

            log(
                "ERROR MICRÓFONO: " +
                error.message,
                "error"
            );

            return;

        }

    }

    const track =
        localStream
        .getAudioTracks()[0];

    if(!track)
        return;

    track.enabled =
        !track.enabled;

    microphoneEnabled =
        track.enabled;

    const button =
        document.getElementById(
            "micButton"
        );

    button.classList.toggle(
        "active",
        !microphoneEnabled
    );

    document.getElementById(
        "menuMicText"

            : "Activar micrófono";

    document.getElementById(
        "infoMic"
    ).textContent =
        microphoneEnabled
            ? "ACTIVO"
            : "SILENCIADO";

    log(
        microphoneEnabled
            ? "🎙️ MICRÓFONO ACTIVADO"
            : "🔇 MICRÓFONO SILENCIADO"
    );

}


async function toggleCamera(){

    if(!localStream){

        try{

            await prepareLocalMedia(true);

            if(peerConnection){

                const videoTrack =
                    localStream
                    .getVideoTracks()[0];

                if(videoTrack){

                    const sender =
                        peerConnection
                        .getSenders()
                        .find(
                            s =>
                                s.track &&
                                s.track.kind === "video"
                        );

                    if(sender){

                        await sender.replaceTrack(
                            videoTrack
                        );

                    }else{

                        peerConnection.addTrack(
                            videoTrack,
                            localStream
                        );

                        /*
                         * Si la llamada comenzó solo
                         * con audio, agregar video después
                         * requiere renegociación.
                         */
                        await renegotiateVideo();

                    }

                }

            }

            return;

        }catch(error){

            log(
                "ERROR CÁMARA: " +
                error.message,
                "error"
            );

            return;

        }

    }

    const videoTrack =
        localStream
        .getVideoTracks()[0];

    if(!videoTrack){

        try{

            const cameraStream =
                await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        width:{
                            ideal:1280
                        },
                        height:{
                            ideal:720
                        },
                        facingMode:"user"
                    }

                });

            const newTrack =
                cameraStream
                .getVideoTracks()[0];

            localStream.addTrack(
                newTrack
            );

            cameraEnabled =
                true;

            localVideo.srcObject =
                localStream;

            localVideo.classList.add(
                "visible"
            );

            if(peerConnection){

                const sender =
                    peerConnection
                    .getSenders()
                    .find(
                        s =>
                            s.track &&
                            s.track.kind === "video"
                    );

                if(sender){

                    await sender.replaceTrack(
                        newTrack
                    );

                }else{

                    peerConnection.addTrack(
                        newTrack,
                        localStream
                    );

                    await renegotiateVideo();

                }

            }

            updateVideoUI();

            log(
                "🎥 CÁMARA ACTIVADA",
                "success"
            );

        }catch(error){

            log(
                "ERROR CÁMARA: " +
                error.message,
                "error"
            );

        }

        return;

    }

    videoTrack.enabled =
        !videoTrack.enabled;

    cameraEnabled =
        videoTrack.enabled;

    updateVideoUI();

    log(
        cameraEnabled
            ? "🎥 CÁMARA ACTIVADA"
            : "📷 CÁMARA DESACTIVADA"
    );

}


function updateVideoUI(){

    localVideo.classList.toggle(
        "visible",
        cameraEnabled
    );

    const button =
        document.getElementById(
            "cameraButton"
        );

    button.classList.toggle(
        "active",
        !cameraEnabled
    );

    document.getElementById(
        "menuCameraText"
    ).textContent =
        cameraEnabled
            ? "Apagar cámara"
            : "Activar cámara";

    document.getElementById(
        "infoCamera"
    ).textContent =
        cameraEnabled
            ? "ACTIVA"
            : "APAGADA";

    if(
        callMode === "video" ||
        cameraEnabled
    ){

        voiceAvatar.style.display =
            "none";

    }else{

        voiceAvatar.style.display =
            "flex";

    }

}

function startCallTimer(){

    if(callTimer)
        return;

    callSeconds =
        0;

    callTimer =
        setInterval(() => {

            callSeconds++;

            activeStatus.textContent =
                formatCallTime();

        },1000);

}


function formatCallTime(){

    const minutes =
        Math.floor(
            callSeconds / 60
        );

    const seconds =
        callSeconds % 60;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );

}

    );

    activeCall.classList.remove(

    );

    incomingOffer =
        null;

    pendingIceCandidates =
        [];

    remoteDescriptionSet =

    microphoneEnabled =

    cameraEnabled =
