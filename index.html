async function unlockAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state === "suspended"){
            await audioContext.resume();
        }

    }catch(e){

        console.log("Audio:",e);

    }

}


/* =========================================================
   INICIALIZAR NEXUS
========================================================= */

async function initializeNexus(){

    try{

        setStatus(
            "Conectando...",
            false
        );

        /*
         * Intentamos recuperar una sesión existente.
         */

        let {
            data: sessionData
        } =
        await supabaseClient
            .auth
            .getSession();

        let session =
            sessionData.session;


        /*
         * Si no existe sesión,
         * creamos usuario anónimo.
         */

        if(!session){

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInAnonymously();

            if(error){
                throw error;
            }

            session =
                data.session;

        }


        if(!session || !session.user){
            throw new Error(
                "No se pudo crear la identidad NEXUS."
            );
        }


        myUserId =
            session.user.id;


        /*
         * Buscamos nuestro número.
         */

        const {
            data:userRow,
            error:userError
        } =
        await supabaseClient
            .from("nexus_users")
            .select("*")
            .eq("id",myUserId)
            .maybeSingle();


        if(userError){
            throw userError;
        }


        if(userRow){

            myNexusNumber =
                String(userRow.nexus_number)
                .padStart(5,"0");

        }else{

            myNexusNumber =
                await createNexusNumber();

        }


        myNumberEl.textContent =
            myNexusNumber;


        /*
         * Nos marcamos como online.
         */

        await updateOnlineStatus(true);


        /*
         * Creamos nuestro canal personal.
         */

        await setupMyChannel();


        setStatus(
            "NEXUS conectado",
            true
        );

        setMessage(
            "Tu número está listo."
        );


        /*
         * Cuando se cierre la página,

         */

        window.addEventListener(
            "beforeunload",
            () => {
                updateOnlineStatus(false);
            }
        );


    }catch(error){

        console.error(error);

        setStatus(
            "Error de conexión",
            false
        );

        showError(
            error.message ||
            "No se pudo iniciar NEXUS."
        );

    }

}


/* =========================================================
   CREAR NÚMERO NEXUS
========================================================= */

async function createNexusNumber(){

    for(let attempt = 0; attempt < 30; attempt++){

        const number =
            String(
                Math.floor(
                    10000 +
                    Math.random() * 90000
                )
            );

        const {
            data,
            error
        } =
        await supabaseClient
            .from("nexus_users")
            .insert({
                id:myUserId,
                nexus_number:number,
                online:true,
                last_seen:new Date().toISOString()
            })
            .select()
            .single();


        if(!error && data){

            return number;

        }


        /*
         * Si el número ya existe,
         * intentamos otro.
         */

        if(
            error &&
            !String(error.message)
                .toLowerCase()
                .includes("duplicate")
        ){

            throw error;

        }

    }

    throw new Error(
        "No se pudo generar un número NEXUS disponible."
    );

}


/* =========================================================
   ESTADO ONLINE
========================================================= */

async function updateOnlineStatus(online){

    if(!myUserId){
        return;
    }

    const {
        error
    } =
    await supabaseClient
        .from("nexus_users")
        .update({
            online:online,
            last_seen:new Date().toISOString()
        })
        .eq("id",myUserId);

    if(error){
        console.warn(
            "Estado:",
            error.message
        );
    }

}


/* =========================================================
   CANAL PERSONAL
========================================================= */

async function setupMyChannel(){

    if(myChannel){

        try{
            await supabaseClient
                .removeChannel(myChannel);
        }catch(e){}

    }


    myChannel =
        supabaseClient.channel(
            "nexus:" + myNexusNumber
        );


    myChannel.on(
        "broadcast",
        { event:"signal" },
        async ({payload}) => {

            try{

                await handleSignal(payload);

            }catch(error){

                console.error(
                    "Signal:",
                    error
                );

            }

        }
    );


    return new Promise(
        (resolve,reject) => {

            myChannel.subscribe(
                status => {

                    console.log(
                        "Canal:",
                        status
                    );

                    if(status === "SUBSCRIBED"){

                        resolve();

                    }

                    if(status === "CHANNEL_ERROR"){

                        reject(
                            new Error(
                                "No se pudo conectar al canal NEXUS."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   CONECTAR AL NÚMERO DESTINO
========================================================= */

async function setupRemoteChannel(number){

    if(remoteChannel){

        try{
            await supabaseClient
                .removeChannel(remoteChannel);
        }catch(e){}

        remoteChannel = null;

    }


    remoteChannel =
        supabaseClient.channel(
            "nexus:" + number
        );


    remoteChannel.subscribe();


    /*
     * Esperamos un momento para asegurarnos
     * de que el canal se una.
     */

    await new Promise(
        resolve => setTimeout(resolve,500)
    );

}


/* =========================================================
   ENVIAR SEÑAL
========================================================= */

async function sendSignal(
    destination,
    payload
){

    const channel =
        destination === myNexusNumber
            ? myChannel
            : (
                remoteChannel &&
                remoteChannel.topic ===
                "realtime:nexus:" + destination
                    ? remoteChannel
                    : null
            );


    if(!channel){

        /*
         * Canal temporal para mandar señal.
         */

        const temp =
            supabaseClient.channel(
                "nexus:" + destination
            );

        temp.subscribe();

        await new Promise(
            resolve => setTimeout(resolve,300)
        );

        await temp.send({
            type:"broadcast",
            event:"signal",
            payload:payload
        });

        await supabaseClient
            .removeChannel(temp);

        return;

    }


    await channel.send({

        type:"broadcast",

        event:"signal",

        payload:payload

    });

}


/* =========================================================
   GENERAR ID DE LLAMADA
========================================================= */

function createCallId(){

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =========================================================
   LLAMAR
========================================================= */

async function startCall(){

    unlockAudio();

    const target =
        dialInput.value.trim();


    if(!/^\d{5}$/.test(target)){

        setMessage(
            "Introduce exactamente 5 dígitos."
        );

        return;

    }


    if(target === myNexusNumber){

        setMessage(
            "No puedes llamarte a ti mismo."
        );

        return;

    }


    try{

        /*
         * Verificamos que exista.
         */

        const {
            data:user,
            error
        } =
        await supabaseClient
            .from("nexus_users")
            .select(
                "nexus_number,online"
            )
            .eq(
                "nexus_number",
                target
            )
            .maybeSingle();


        if(error){
            throw error;
        }


        if(!user){

            setMessage(
                "El número " +
                target +
                " no existe."
            );

            return;

        }


        currentRemoteNumber =
            target;

        currentCallId =
            createCallId();


        showCallScreen(
            target,
            "Llamando..."
        );


        /*
         * Obtenemos micrófono.
         */

        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true,
                    video:false
                });


        /*
         * Creamos conexión WebRTC.
         */

        await createPeerConnection(
            target
        );


        /*
         * Creamos oferta.
         */

        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(offer);


        /*
         * Mandamos la oferta
         * al número destino.
         */

        await sendSignal(
            target,
            {
                type:"incoming_call",
                callId:currentCallId,
                from:myNexusNumber,
                to:target,
                offer:offer
            }
        );


        callStateEl.textContent =
            "Esperando respuesta...";


    }catch(error){

        console.error(error);

        closeCall();

        showError(
            error.message ||
            "No se pudo iniciar la llamada."
        );

    }

}


/* =========================================================
   CREAR PEER CONNECTION
========================================================= */

async function createPeerConnection(
    remoteNumber
){

    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

    }


    peerConnection =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                    "stun:stun1.l.google.com:19302"
                }

            ]

        });


    /*
     * Micrófono local.
     */

    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });

    }


    /*
     * Audio remoto.
     */

    peerConnection.ontrack =
        event => {

            if(event.streams[0]){

                remoteAudio.srcObject =
                    event.streams[0];

                remoteAudio
                    .play()
                    .catch(() => {});

            }

        };


    /*
     * ICE candidates.
     */

    peerConnection.onicecandidate =
        async event => {

            if(
                event.candidate &&
                currentCallId
            ){

                await sendSignal(
                    remoteNumber,
                    {
                        type:"ice",
                        callId:currentCallId,
                        from:myNexusNumber,
                        to:remoteNumber,
                        candidate:event.candidate
                    }
                );

            }

        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;


            if(state === "connected"){

                callStateEl.textContent =
                    "Conectado";

            }

            if(state === "connecting"){

                callStateEl.textContent =
                    "Conectando audio...";

            }

            if(
                state === "failed" ||
                state === "disconnected"
            ){

                callStateEl.textContent =
                    "Conexión perdida";

            }

        };

}


/* =========================================================
   PROCESAR SEÑALES
========================================================= */

async function handleSignal(payload){

    if(!payload){
        return;
    }


    if(
        payload.to &&
        payload.to !== myNexusNumber
    ){

        return;

    }


    /*
     * LLAMADA ENTRANTE
     */

    if(payload.type === "incoming_call"){

        if(currentCallId){
            return;
        }


        incomingOffer =
            payload.offer;

        incomingCaller =
            payload.from;

        currentCallId =
            payload.callId;

        currentRemoteNumber =
            payload.from;


        incomingNumberEl.textContent =
            payload.from;


        incomingScreen
            .classList
            .add("show");


        startRingtone();

        return;

    }


    /*
     * RESPUESTA
     */

    if(payload.type === "answer"){

        if(
            !peerConnection ||
            payload.callId !== currentCallId
        ){
            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    payload.answer
                )
            );


        callStateEl.textContent =
            "Conectando audio...";

        return;

    }


    /*
     * ICE
     */

    if(payload.type === "ice"){

        if(
            !peerConnection ||
            payload.callId !== currentCallId
        ){
            return;
        }


        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        payload.candidate
                    )
                );

        }catch(error){

            console.warn(
                "ICE:",
                error
            );

        }

        return;

    }


    /*
     * RECHAZO
     */

    if(payload.type === "reject"){

        if(
            payload.callId !== currentCallId
        ){
            return;
        }


        callStateEl.textContent =
            "Llamada rechazada";

        setTimeout(
            closeCall,
            1000
        );

        return;

    }


    /*
     * COLGAR
     */

    if(payload.type === "hangup"){

        if(
            payload.callId !== currentCallId
        ){
            return;
        }


        closeCall();

        return;

    }

}


/* =========================================================
   ACEPTAR LLAMADA
========================================================= */

async function acceptIncoming(){

    unlockAudio();

    stopRingtone();


    if(
        !incomingOffer ||
        !incomingCaller
    ){

        rejectIncoming();
        return;

    }


    incomingScreen
        .classList
        .remove("show");


    showCallScreen(
        incomingCaller,
        "Aceptando..."
    );


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true,
                    video:false
                });


        await createPeerConnection(
            incomingCaller
        );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingOffer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(answer);


        await sendSignal(
            incomingCaller,
            {
                type:"answer",
                callId:currentCallId,
                from:myNexusNumber,
                to:incomingCaller,
                answer:answer
            }
        );


        callStateEl.textContent =
            "Conectando audio...";


        incomingOffer = null;
        incomingCaller = null;


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "No se pudo aceptar la llamada."
        );

        closeCall();

    }

}


/* =========================================================
   RECHAZAR
========================================================= */

async function rejectIncoming(){

    stopRingtone();


    if(incomingCaller && currentCallId){

        try{

            await sendSignal(
                incomingCaller,
                {
                    type:"reject",
                    callId:currentCallId,
                    from:myNexusNumber,
                    to:incomingCaller
                }
            );

        }catch(e){}

    }


    incomingOffer = null;
    incomingCaller = null;
    currentCallId = null;
    currentRemoteNumber = null;


    incomingScreen
        .classList
        .remove("show");

}


/* =========================================================
   COLGAR
========================================================= */

async function hangUp(){

    if(
        currentRemoteNumber &&
        currentCallId
    ){

        try{

            await sendSignal(
                currentRemoteNumber,
                {
                    type:"hangup",
                    callId:currentCallId,
                    from:myNexusNumber,
                    to:currentRemoteNumber
                }
            );

        }catch(e){}

    }


    closeCall();

}


/* =========================================================
   CERRAR LLAMADA
========================================================= */

function closeCall(){

    stopRingtone();


    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

        peerConnection = null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        localStream = null;

    }


    remoteAudio.srcObject = null;


    callScreen
        .classList
        .remove("show");


    incomingScreen
        .classList
        .remove("show");


    currentCallId = null;
    currentRemoteNumber = null;

    incomingOffer = null;
    incomingCaller = null;

    isMuted = false;

    const muteBtn =
        document.getElementById("muteBtn");

    muteBtn.classList.remove("active");

}


/* =========================================================
   SILENCIAR
========================================================= */

function toggleMute(){

    if(!localStream){
        return;
    }


    isMuted = !isMuted;


    localStream
        .getAudioTracks()
        .forEach(track => {

            track.enabled =
                !isMuted;

        });


    const button =
        document.getElementById("muteBtn");


    button.classList.toggle(
        "active",
        isMuted
    );

}


/* =========================================================
   TONO DE LLAMADA
========================================================= */

function startRingtone(){

    stopRingtone();

    unlockAudio();


    if(!audioContext){
        return;
    }


    let playing = false;


    function beep(){

        if(playing){
            return;
        }

        playing = true;


        try{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.frequency.value =
                780;

            oscillator.type =
                "sine";


            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.16,
                audioContext.currentTime + 0.03
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.7
            );


            oscillator.connect(gain);
            gain.connect(audioContext.destination);


            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 0.7
            );


            oscillator.onended =
                () => {
                    playing = false;
                };

        }catch(e){

            playing = false;

        }

    }


    beep();

    ringtoneInterval =
        setInterval(
            beep,
            1800
        );

}


function stopRingtone(){

    if(ringtoneInterval){

        clearInterval(
            ringtoneInterval
        );

        ringtoneInterval = null;

    }

}


/* =========================================================
   TECLADO
========================================================= */

function pressKey(number){

    if(dialInput.value.length >= 5){
        return;
    }

    dialInput.value += number;

}


function clearDial(){

    dialInput.value = "";

}

        );

        setMessage(

        );

    }catch(e){

/* =========================================================
   TECLADO FÍSICO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key >= "0" &&
            event.key <= "9"
        ){

            pressKey(event.key);

        }


        if(event.key === "Backspace"){

            dialInput.value =
                dialInput.value.slice(
                    0,
                    -1
                );

        }


        if(event.key === "Enter"){

            startCall();

        }

    }
);
