<style>

body{

<div class="app">

<header>

        <div class="call-buttons">
            <button class="accept" onclick="acceptIncoming()">

</div>

<div class="screen" id="activeScreen">

        <div class="call-icon">🔊</div>
        <div class="call-title">En llamada</div>
        <div class="call-number" id="activeNumber">-----</div>

        <button class="audio-button hidden" id="audioButton" onclick="activateAudio()">
            🔊 ACTIVAR AUDIO
        </button>

        <button class="hangup" onclick="hangupCall()">
            COLGAR
        </button>
    </div>
</div>

<script>
const SUPABASE_URL =
    "https://nrffcctjnesotfveaek.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zI1_i95-Pe1VQT3ru0MurQ_Ysi6eY3S";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let myNumber = null;
let myChannel = null;

let dialedNumber = "";

let peerConnection = null;
let localStream = null;

let currentCallId = null;
let currentRemoteNumber = null;

let incomingOffer = null;
let incomingCaller = null;

let remoteDescriptionSet = false;
let pendingIceCandidates = [];

const remoteAudio =
    document.getElementById("remoteAudio");

const statusEl =
    document.getElementById("status");

const debugEl =
    document.getElementById("debug");

function debugLog(...args){
    console.log(...args);

    const line = document.createElement("div");

    line.textContent =
        new Date().toLocaleTimeString() +
        " " +
        args.map(x => {
            try{
                return typeof x === "object"
                    ? JSON.stringify(x)
                    : String(x);
            }catch{
                return String(x);
            }
        }).join(" ");

    debugEl.appendChild(line);
    debugEl.scrollTop = debugEl.scrollHeight;
}

function setStatus(text,color){
    statusEl.textContent = text;

    if(color){
        statusEl.style.color = color;
    }
}

function updateDisplay(){
    document.getElementById("dialDisplay").textContent =
        dialedNumber.padEnd(5,"_");
}

function pressKey(key){
    if(!/^[0-9]$/.test(key)) return;

    if(dialedNumber.length >= 5){
        return;
    }

    dialedNumber += key;
    updateDisplay();
}

function deleteDigit(){
    dialedNumber =
        dialedNumber.slice(0,-1);

    updateDisplay();
}

function generateNexusNumber(){
    return String(
        Math.floor(
            10000 + Math.random() * 90000
        )
    );
}

async function ensureAuth(){

    let {
        data:{
            session
        },
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){
        throw error;
    }

    if(!session){

        debugLog("🔐 CREANDO SESIÓN ANÓNIMA");

        const result =
            await supabaseClient.auth.signInAnonymously();

        if(result.error){
            throw result.error;
        }

        session = result.data.session;
    }

    return session;
}

async function createNexusUser(){

    const session =
        await ensureAuth();

    const userId =
        session.user.id;

    let {
        data,
        error
    } =
        await supabaseClient
        .from("nexus_users")
        .select("*")
        .eq("id",userId)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(data){
        myNumber =
            String(data.nexus_number).trim();

        debugLog(
            "☎️ NÚMERO EXISTENTE:",
            myNumber
        );
    }else{

        let created = false;

        for(let i=0;i<30;i++){

            const candidate =
                generateNexusNumber();

            const result =
                await supabaseClient
                .from("nexus_users")
                .insert({
                    id:userId,
                    nexus_number:candidate,
                    online:true,
                    last_seen:new Date().toISOString()
                })
                .select()
                .single();

            if(!result.error){

                myNumber =
                    candidate;

                created = true;

                debugLog(
                    "☎️ NUEVO NÚMERO:",
                    myNumber
                );

                break;
            }
        }

        if(!created){
            throw new Error(
                "No se pudo generar un número NEXUS."
            );
        }
    }

    await supabaseClient
        .from("nexus_users")
        .update({
            online:true,
            last_seen:new Date().toISOString()
        })
        .eq("id",userId);
}

async function setupMyChannel(){

    if(!myNumber){
        throw new Error(
            "No existe número NEXUS."
        );
    }

    if(myChannel){
        try{
            await supabaseClient.removeChannel(
                myChannel
            );
        }catch(e){}
    }

    myChannel =
        supabaseClient.channel(
            "nexus:" + myNumber
        );

    myChannel.on(
        "broadcast",
        {
            event:"signal"
        },
        ({payload}) => {

            debugLog(
                "📡 SEÑAL RECIBIDA:",
                payload?.type
            );

            handleSignal(payload);
        }
    );

    return new Promise((resolve,reject)=>{

        let done = false;

        myChannel.subscribe(status => {

            debugLog(
                "NEXUS CHANNEL:",
                status
            );

            if(status === "SUBSCRIBED"){

                if(done) return;

                done = true;

                setStatus(
                    "● EN LÍNEA • " + myNumber,
                    "#67f7a3"
                );

                resolve();
            }

            if(
                status === "CHANNEL_ERROR" ||
                status === "TIMED_OUT"
            ){

                if(done) return;

                done = true;

                reject(
                    new Error(
                        "No se pudo conectar al canal NEXUS."
                    )
                );
            }
        });
    });
}

async function init(){

    try{

        debugLog("🚀 INICIANDO NEXUS");

        await createNexusUser();

        await setupMyChannel();

        debugLog(
            "✅ NEXUS LISTO:",
            myNumber
        );

    }catch(error){

        console.error(error);

        debugLog(
            "❌ INIT:",
            error?.message,
            error
        );

        setStatus(
            "ERROR DE CONEXIÓN",
            "#ff6464"
        );
    }
}

async function sendSignal(
    destination,
    payload
){

    debugLog(
        "📤 ENVIANDO:",
        payload.type,
        "A:",
        destination
    );

    const channel =
        supabaseClient.channel(
            "nexus:" + destination
        );

    return new Promise((resolve,reject)=>{

        let finished = false;

        function finishError(error){

            if(finished) return;

            finished = true;

            reject(error);
        }

        function finishSuccess(){

            if(finished) return;

            finished = true;

            resolve();
        }

        channel.subscribe(
            async status => {

                debugLog(
                    "📡 CANAL TEMP:",
                    destination,
                    status
                );

                if(
                    status === "SUBSCRIBED"
                ){

                    try{

                        /*
                         * IMPORTANTE:
                         * channel.send() devuelve "ok"
                         * cuando funciona.
                         *
                         * NO debemos pasar "ok"
                         * como argumento de finish(),
                         * porque el código lo trataría
                         * como un error.
                         */

                        await channel.send({
                            type:"broadcast",
                            event:"signal",
                            payload:payload
                        });

                        debugLog(
                            "✅ SEÑAL ENVIADA:",
                            payload.type
                        );

                        try{
                            await supabaseClient
                                .removeChannel(channel);
                        }catch(e){}

                        finishSuccess();

                    }catch(error){

                        debugLog(
                            "❌ SEND SIGNAL:",
                            error?.message || error
                        );

                        try{
                            await supabaseClient
                                .removeChannel(channel);
                        }catch(e){}

                        finishError(error);
                    }
                }

                if(status === "CHANNEL_ERROR"){

                    finishError(
                        new Error(
                            "CHANNEL_ERROR enviando señal."
                        )
                    );
                }

                if(status === "TIMED_OUT"){

                    finishError(
                        new Error(
                            "TIMEOUT enviando señal."
                        )
                    );
                }
            }
        );
    });
}

async function getMicrophone(){

    debugLog(
        "🎙️ SOLICITANDO MICRÓFONO..."
    );

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){
        throw new Error(
            "Este navegador no permite acceder al micrófono aquí."
        );
    }

    localStream =
        await navigator.mediaDevices.getUserMedia({
            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            },
            video:false
        });

    debugLog(
        "🎙️ MICRÓFONO OBTENIDO"
    );

    return localStream;
}

function createPeerConnection(){

    debugLog(
        "🔗 CREANDO PEER CONNECTION"
    );

    pendingIceCandidates = [];

    remoteDescriptionSet = false;

    peerConnection =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                    "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                    "stun:stun1.l.google.com:19302"
                }
            ],

            iceCandidatePoolSize:10
        });

    peerConnection.onicecandidate =
        async event => {

            if(!event.candidate){
                return;
            }

            debugLog(
                "🧊 ICE LOCAL"
            );

            try{

                await sendSignal(
                    currentRemoteNumber,
                    {
                        type:"ice",
                        callId:currentCallId,
                        candidate:event.candidate
                    }
                );

            }catch(error){

                debugLog(
                    "❌ ENVÍO ICE:",
                    error?.message || error
                );
            }
        };

    peerConnection.ontrack =
        event => {

            debugLog(
                "🔊 TRACK REMOTO RECIBIDO"
            );

            if(event.streams && event.streams[0]){

                remoteAudio.srcObject =
                    event.streams[0];

            }else{

                const stream =
                    new MediaStream();

                stream.addTrack(
                    event.track
                );

                remoteAudio.srcObject =
                    stream;
            }

            remoteAudio
                .play()
                .then(()=>{
                    debugLog(
                        "🔊 AUDIO REMOTO REPRODUCIÉNDOSE"
                    );

                    document
                        .getElementById("audioButton")
                        .classList
                        .add("hidden");
                })
                .catch(error=>{

                    debugLog(
                        "⚠️ AUTOPLAY BLOQUEADO:",
                        error?.message || error
                    );

                    document
                        .getElementById("audioButton")
                        .classList
                        .remove("hidden");
                });
        };

    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;

            debugLog(
                "🔗 ESTADO WEBRTC:",
                state
            );

            if(state === "connected"){

                setStatus(
                    "● LLAMADA CONECTADA",
                    "#67f7a3"
                );

                showScreen("activeScreen");

            }

            if(
                state === "failed" ||
                state === "disconnected"
            ){

                debugLog(
                    "⚠️ WEBRTC:",
                    state
                );
            }

            if(state === "closed"){
                debugLog(
                    "📴 PEER CONNECTION CERRADA"
                );
            }
        };

    peerConnection.oniceconnectionstatechange =
        () => {

            debugLog(
                "🧊 ICE STATE:",
                peerConnection.iceConnectionState
            );
        };

    if(localStream){

        localStream
            .getTracks()
            .forEach(track=>{

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });
    }

    return peerConnection;
}

async function flushPendingIce(){

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){
        return;
    }

    if(!pendingIceCandidates.length){
        return;
    }

    debugLog(
        "🧊 PROCESANDO ICE EN COLA:",
        pendingIceCandidates.length
    );

    const queue =
        [...pendingIceCandidates];

    pendingIceCandidates = [];

    for(const candidate of queue){

        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(candidate)
                );

            debugLog(
                "✅ ICE DE COLA AÑADIDO"
            );

        }catch(error){

            debugLog(
                "❌ ICE DE COLA:",
                error?.message || error
            );
        }
    }
}

async function addRemoteIce(candidate){

    if(!candidate){
        return;
    }

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        pendingIceCandidates.push(
            candidate
        );

        debugLog(
            "🧊 ICE GUARDADO EN COLA"
        );

        return;
    }

    try{

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(candidate)
            );

        debugLog(
            "🧊 ICE REMOTO AÑADIDO"
        );

    }catch(error){

        debugLog(
            "❌ ADD ICE:",
            error?.message || error
        );
    }
}

async function startCall(){

    if(dialedNumber.length !== 5){

        alert(
            "Escribe un número NEXUS de 5 dígitos."
        );

        return;
    }

    if(!myNumber){

        alert(
            "NEXUS todavía no está conectado."
        );

        return;
    }

    if(
        dialedNumber === myNumber
    ){

        alert(
            "No puedes llamar a tu propio número."
        );

        return;
    }

    const destination =
        dialedNumber;

    currentRemoteNumber =
        destination;

    currentCallId =
        crypto.randomUUID();

    debugLog(
        "📞 STARTCALL:",
        destination,
        currentCallId
    );

    try{

        showScreen("callingScreen");

        document
            .getElementById("callingNumber")
            .textContent =
            destination;

        await getMicrophone();

        createPeerConnection();

        const offer =
            await peerConnection
                .createOffer();

        debugLog(
            "📄 OFFER CREADO"
        );

        await peerConnection
            .setLocalDescription(offer);

        debugLog(
            "📄 LOCAL DESCRIPTION LISTA"
        );

        await sendSignal(
            destination,
            {
                type:"incoming_call",
                callId:currentCallId,
                caller:myNumber,
                offer:offer
            }
        );

        debugLog(
            "📞 LLAMADA ENVIADA"
        );

    }catch(error){

        console.error(
            "ERROR STARTCALL:",
            error
        );

        debugLog(
            "❌ STARTCALL:",
            error?.message || error,
            error
        );

        alert(
            "No se pudo iniciar la llamada."
        );

        cleanupCall();
    }
}

async function acceptIncoming(){

    debugLog(
        "📥 ACCEPT INCOMING"
    );

    try{

        if(
            !incomingOffer ||
            !incomingCaller ||
            !currentCallId
        ){
            throw new Error(
                "No hay una llamada entrante válida."
            );
        }

        currentRemoteNumber =
            incomingCaller;

        await getMicrophone();

        createPeerConnection();

        debugLog(
            "📄 APLICANDO OFFER"
        );

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingOffer
                )
            );

        remoteDescriptionSet = true;

        debugLog(
            "✅ REMOTE DESCRIPTION LISTA"
        );

        await flushPendingIce();

        const answer =
            await peerConnection
                .createAnswer();

        debugLog(
            "📄 ANSWER CREADO"
        );

        await peerConnection
            .setLocalDescription(answer);

        debugLog(
            "📄 LOCAL ANSWER LISTA"
        );

        await sendSignal(
            currentRemoteNumber,
            {
                type:"answer",
                callId:currentCallId,
                answer:answer
            }
        );

        debugLog(
            "✅ ANSWER ENVIADO"
        );

        document
            .getElementById("incomingScreen")
            .classList
            .remove("active");

        showScreen("activeScreen");

        document
            .getElementById("activeNumber")
            .textContent =
            currentRemoteNumber;

        stopRingtone();

    }catch(error){

        console.error(
            "ERROR ACEPTANDO:",
            error
        );

        debugLog(
            "❌ ACCEPT:",
            error?.message || error,
            error
        );

        alert(
            "No se pudo aceptar la llamada."
        );

        cleanupCall();
    }
}

async function rejectIncoming(){

    try{

        if(
            currentRemoteNumber &&
            currentCallId
        ){

            await sendSignal(
                currentRemoteNumber,
                {
                    type:"reject",
                    callId:currentCallId
                }
            );
        }

    }catch(error){

        debugLog(
            "❌ REJECT:",
            error?.message || error
        );
    }

    stopRingtone();
    cleanupCall();
}

async function hangupCall(){

    try{

        if(
            currentRemoteNumber &&
            currentCallId
        ){

            await sendSignal(
                currentRemoteNumber,
                {
                    type:"hangup",
                    callId:currentCallId
                }
            );
        }

    }catch(error){

        debugLog(
            "❌ HANGUP SIGNAL:",
            error?.message || error
        );
    }

    cleanupCall();
}

async function handleSignal(payload){

    if(!payload){
        return;
    }

    debugLog(
        "📨 HANDLE:",
        payload.type
    );

    if(payload.type === "incoming_call"){

        incomingOffer =
            payload.offer;

        incomingCaller =
            payload.caller;

        currentCallId =
            payload.callId;

        currentRemoteNumber =
            payload.caller;

        debugLog(
            "📞 LLAMADA ENTRANTE DE:",
            incomingCaller
        );

        document
            .getElementById("incomingNumber")
            .textContent =
            incomingCaller;

        showScreen("incomingScreen");

        startRingtone();

        return;
    }

    if(
        payload.callId &&
        currentCallId &&
        payload.callId !== currentCallId
    ){

        debugLog(
            "⚠️ SEÑAL DE OTRA LLAMADA IGNORADA"
        );

        return;
    }

    if(payload.type === "answer"){

        debugLog(
            "📥 ANSWER RECIBIDO"
        );

        try{

            if(!peerConnection){

                debugLog(
                    "⚠️ ANSWER SIN PEERCONNECTION"
                );

                return;
            }

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        payload.answer
                    )
                );

            remoteDescriptionSet = true;

            debugLog(
                "✅ ANSWER APLICADO"
            );

            await flushPendingIce();

        }catch(error){

            debugLog(
                "❌ APPLY ANSWER:",
                error?.message || error
            );
        }

        return;
    }

    if(payload.type === "ice"){

        debugLog(
            "🧊 ICE RECIBIDO"
        );

        await addRemoteIce(
            payload.candidate
        );

        return;
    }

    if(payload.type === "reject"){

        debugLog(
            "❌ LLAMADA RECHAZADA"
        );

        alert(
            "La llamada fue rechazada."
        );

        cleanupCall();

        return;
    }

    if(payload.type === "hangup"){

        debugLog(
            "📴 COLGAR RECIBIDO"
        );

        cleanupCall();

        return;
    }
}

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList
        .add("active");
}

function startRingtone(){

    /*
     * No generamos un archivo externo.
     * Creamos un pequeño tono usando Web Audio.
     */

    try{

        if(window.ringtoneInterval){
            return;
        }

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        const ctx =
            new AudioContext();

        window.ringtoneContext = ctx;

        function beep(){

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            oscillator.frequency.value = 650;

            gain.gain.value = 0.05;

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start();

            oscillator.stop(
                ctx.currentTime + .18
            );
        }

        beep();

        window.ringtoneInterval =
            setInterval(beep,1200);

    }catch(error){

        debugLog(
            "⚠️ RINGTONE:",
            error?.message || error
        );
    }
}

function stopRingtone(){

    if(window.ringtoneInterval){

        clearInterval(
            window.ringtoneInterval
        );

        window.ringtoneInterval =
            null;
    }

    if(window.ringtoneContext){

        try{
            window.ringtoneContext.close();
        }catch(e){}

        window.ringtoneContext =
            null;
    }
}

async function activateAudio(){

    try{

        await remoteAudio.play();

        document
            .getElementById("audioButton")
            .classList
            .add("hidden");

        debugLog(
            "🔊 AUDIO ACTIVADO MANUALMENTE"
        );

    }catch(error){

        debugLog(
            "❌ ACTIVATE AUDIO:",
            error?.message || error
        );
    }
}

async function cleanupCall(){

    stopRingtone();

    if(localStream){

        localStream
            .getTracks()
            .forEach(track=>{
                try{
                    track.stop();
                }catch(e){}
            });

        localStream = null;
    }

    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

        peerConnection = null;
    }

    remoteAudio.srcObject = null;

    remoteDescriptionSet = false;

    pendingIceCandidates = [];

    currentCallId = null;
    currentRemoteNumber = null;

    incomingOffer = null;
    incomingCaller = null;

    document
        .getElementById("audioButton")
        .classList
        .add("hidden");

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    setStatus(
        "● EN LÍNEA • " + myNumber,
        "#67f7a3"
    );

    debugLog(
        "🧹 LLAMADA LIMPIADA"
    );
}

window.addEventListener(

                    })
                    .eq(
                        "nexus_number",

                    );
            }

        }catch(e){}
    }
);

updateDisplay();
init();
