<style>

body{

.call-box{

.call-title{

.call-number{

.call-state{

.call-buttons{

.call-buttons button{

.audio-button{

footer{

<script>

/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://nrffcctjnesotfveaeky.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zI1_i95-Pe1VQT3ru0MurQ_Ysi6eY3S";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let myNumber = null;
let myUserId = null;

let channel = null;

let currentCall = null;
let currentPeer = null;
let localStream = null;

let remoteDescriptionSet = false;
let pendingIceCandidates = [];

let currentIncomingOffer = null;
let currentIncomingFrom = null;


/* =========================================================
   DEBUG
========================================================= */

function debugLog(...args){

    const box =
        document.getElementById("debug");

    const time =
        new Date().toLocaleTimeString();

    const text =
        args.map(value => {

            if(typeof value === "object"){

                try{
                    return JSON.stringify(value);
                }catch{
                    return String(value);
                }

            }

            return String(value);

        }).join(" ");


    box.textContent +=
        `[${time}] ${text}\n`;

    box.scrollTop =
        box.scrollHeight;


    console.log(...args);
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    color
){

    const status =
        document.getElementById("status");

    status.textContent =
        text;

    if(color){

        status.style.color =
            color;
    }
}


/* =========================================================
   MARCADOR
========================================================= */

let dialNumber = "";


function pressKey(key){

    if(
        key === "*" ||
        key === "#"
    ){

        return;
    }


    if(
        dialNumber.length >= 5
    ){

        return;
    }


    dialNumber += key;

    updateDisplay();
}


function clearNumber(){

    dialNumber =
        dialNumber.slice(0,-1);

    updateDisplay();
}


function updateDisplay(){

    const display =
        document.getElementById("display");


    display.textContent =
        dialNumber || "-----";


    display.classList.toggle(
        "empty",
        !dialNumber
    );
}


/* =========================================================
   PRUEBA DE CONEXIÓN SUPABASE
========================================================= */

async function testSupabaseConnection(){

    debugLog(
        "🌐 PROBANDO CONEXIÓN SUPABASE..."
    );


    try{

        const url =
            SUPABASE_URL +
            "/auth/v1/health";


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        debugLog(
            "🌐 SUPABASE HTTP:",
            response.status,
            response.statusText
        );


        const text =
            await response.text();


        debugLog(
            "🌐 SUPABASE RESPUESTA:",
            text.slice(0,300)
        );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status} ${response.statusText}`
            );
        }


        debugLog(
            "✅ SUPABASE ES ACCESIBLE"
        );


        return true;


    }catch(error){

        debugLog(
            "❌ FETCH REAL:",
            error?.name || "Error",
            error?.message || String(error)
        );


        if(error?.cause){

            debugLog(
                "❌ CAUSE:",
                error.cause
            );
        }


        throw error;
    }
}


/* =========================================================
   CREAR USUARIO NEXUS
========================================================= */

async function createNexusUser(){

    debugLog(
        "🔐 CREANDO SESIÓN ANÓNIMA"
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInAnonymously();


    if(error){

        throw error;
    }


    if(!data?.user){

        throw new Error(
            "Supabase no devolvió usuario anónimo."
        );
    }


    myUserId =
        data.user.id;


    debugLog(
        "✅ SESIÓN:",
        myUserId
    );


    const {
        data:existing,
        error:existingError
    } =
        await supabaseClient
            .from("nexus_users")
            .select("nexus_number")
            .eq("id",myUserId)
            .maybeSingle();


    if(existingError){

        throw existingError;
    }


    if(existing?.nexus_number){

        myNumber =
            String(existing.nexus_number);


        debugLog(
            "📱 NÚMERO EXISTENTE:",
            myNumber
        );


    }else{

        let created =
            false;


        for(
            let attempt = 0;
            attempt < 30;
            attempt++
        ){

            const candidate =
                String(
                    Math.floor(
                        10000 +
                        Math.random() * 90000
                    )
                );


            const {
                error:insertError
            } =
                await supabaseClient
                    .from("nexus_users")
                    .insert({

                        id:
                            myUserId,

                        nexus_number:
                            candidate,

                        online:
                            true,

                        last_seen:
                            new Date().toISOString()
                    });


            if(!insertError){

                myNumber =
                    candidate;

                created =
                    true;


                debugLog(
                    "📱 NUEVO NÚMERO:",
                    myNumber
                );


                break;
            }


            if(
                insertError.code === "23505"
            ){

                continue;
            }


            throw insertError;
        }


        if(!created){

            throw new Error(
                "No fue posible asignar un número NEXUS."
            );
        }
    }


    document.getElementById(
        "myNumber"
    ).textContent =
        myNumber;
}


/* =========================================================
   CANAL PERSONAL
========================================================= */

async function setupMyChannel(){

    debugLog(
        "📡 CREANDO CANAL:",
        `nexus:${myNumber}`
    );


    channel =
        supabaseClient.channel(
            `nexus:${myNumber}`,
            {
                config:{
                    broadcast:{
                        self:false
                    }
                }
            }
        );


    channel.on(
        "broadcast",
        {
            event:"signal"
        },
        ({payload}) => {

            debugLog(
                "📡 SEÑAL RECIBIDA:",
                payload?.type
            );


            handleSignal(payload);
        }
    );


    const status =
        await new Promise(
            (resolve,reject) => {

                const timeout =
                    setTimeout(
                        () => {

                            reject(
                                new Error(
                                    "Timeout conectando Realtime."
                                )
                            );

                        },
                        15000
                    );


                channel.subscribe(
                    status => {

                        debugLog(
                            "NEXUS CHANNEL:",
                            status
                        );


                        if(
                            status ===
                            "SUBSCRIBED"
                        ){

                            clearTimeout(
                                timeout
                            );


                            resolve(
                                status
                            );
                        }


                        if(
                            status ===
                            "CHANNEL_ERROR" ||
                            status ===
                            "TIMED_OUT"
                        ){

                            clearTimeout(
                                timeout
                            );


                            reject(
                                new Error(
                                    "Realtime: " +
                                    status
                                )
                            );
                        }
                    }
                );
            }
        );


    debugLog(
        "✅ CANAL LISTO:",
        status
    );


    await supabaseClient
        .from("nexus_users")
        .update({

            online:
                true,

            last_seen:
                new Date().toISOString()

        })
        .eq(
            "id",
            myUserId
        );


    window.addEventListener(
        "beforeunload",
        () => {

            supabaseClient
                .from("nexus_users")
                .update({

                    online:
                        false,

                    last_seen:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    myUserId
                );
        }
    );


    setStatus(
        "ONLINE • " + myNumber,
        "#5de1ff"
    );
}


/* =========================================================
   ENVIAR SEÑAL
========================================================= */

async function sendSignal(
    destination,
    payload
){

    debugLog(
        "📤 ENVIANDO:",
        payload.type,
        "→",
        destination
    );


    const tempChannel =
        supabaseClient.channel(
            `nexus:${destination}`
        );


    try{

        await new Promise(
            (resolve,reject) => {

                const timeout =
                    setTimeout(
                        () => {

                            reject(
                                new Error(
                                    "Timeout conectando canal destino."
                                )
                            );

                        },
                        10000
                    );


                tempChannel.subscribe(
                    async status => {

                        debugLog(
                            "📡 CANAL DESTINO:",
                            status
                        );


                        if(
                            status ===
                            "SUBSCRIBED"
                        ){

                            clearTimeout(
                                timeout
                            );


                            try{

                                await tempChannel.send({

                                    type:
                                        "broadcast",

                                    event:
                                        "signal",

                                    payload:
                                        payload
                                });


                                /*
                                   Supabase devuelve "ok"
                                   cuando send() funciona.
                                   NO es un error.
                                */

                                resolve();


                            }catch(error){

                                reject(
                                    error
                                );
                            }
                        }


                        if(
                            status ===
                            "CHANNEL_ERROR" ||
                            status ===
                            "TIMED_OUT"
                        ){

                            clearTimeout(
                                timeout
                            );


                            reject(
                                new Error(
                                    "Canal destino: " +
                                    status
                                )
                            );
                        }
                    }
                );
            }
        );


        debugLog(
            "✅ SEÑAL ENVIADA:",
            payload.type
        );


    }finally{

        await supabaseClient
            .removeChannel(
                tempChannel
            );
    }
}


/* =========================================================
   MANEJAR SEÑALES
========================================================= */

async function handleSignal(
    payload
){

    if(
        !payload ||
        !payload.type
    ){

        return;
    }


    if(
        payload.type ===
        "incoming_call"
    ){

        await receiveIncomingCall(
            payload
        );

        return;
    }


    if(
        payload.type ===
        "answer"
    ){

        debugLog(
            "📥 ANSWER RECIBIDO"
        );


        await handleAnswer(
            payload
        );


        return;
    }


    if(
        payload.type ===
        "ice"
    ){

        await handleRemoteIce(
            payload
        );


        return;
    }


    if(
        payload.type ===
        "reject"
    ){

        debugLog(
            "📵 LLAMADA RECHAZADA"
        );


        showOutgoingState(
            "Llamada rechazada"
        );


        setTimeout(
            cleanupCall,
            1000
        );


        return;
    }


    if(
        payload.type ===
        "hangup"
    ){

        debugLog(
            "📴 LLAMADA FINALIZADA"
        );


        cleanupCall();

        return;
    }
}


/* =========================================================
   INICIAR LLAMADA
========================================================= */

async function startCall(){

    if(
        dialNumber.length !== 5
    ){

        debugLog(
            "⚠️ EL NÚMERO DEBE TENER 5 DÍGITOS"
        );

        return;
    }


    if(
        dialNumber === myNumber
    ){

        debugLog(
            "⚠️ NO PUEDES LLAMARTE A TI MISMO"
        );

        return;
    }


    const destination =
        dialNumber;


    debugLog(
        "🚀 STARTCALL:",
        destination
    );


    try{

        showOutgoingScreen(
            destination
        );


        const {
            data:user,
            error
        } =
            await supabaseClient
                .from("nexus_users")
                .select(
                    "id,nexus_number,online"
                )
                .eq(
                    "nexus_number",
                    destination
                )
                .maybeSingle();


        if(error){

            throw error;
        }


        if(!user){

            showOutgoingState(
                "Número no encontrado"
            );


            debugLog(
                "❌ NÚMERO NO EXISTE:",
                destination
            );


            setTimeout(
                cleanupCall,
                1800
            );


            return;
        }


        currentCall = {

            id:
                crypto.randomUUID(),

            from:
                myNumber,

            to:
                destination,

            remoteUserId:
                user.id
        };


        await createPeerConnection(
            destination
        );


        await createLocalAudio();


        const offer =
            await currentPeer
                .createOffer();


        await currentPeer
            .setLocalDescription(
                offer
            );


        await sendSignal(
            destination,
            {

                type:
                    "incoming_call",

                from:
                    myNumber,

                to:
                    destination,

                callId:
                    currentCall.id,

                offer:
                    offer
            }
        );


        showOutgoingState(
            "Llamando..."
        );


    }catch(error){

        debugLog(
            "❌ ERROR STARTCALL:",
            error?.message || error
        );


        cleanupCall();
    }
}


/* =========================================================
   CREAR WEBRTC
========================================================= */

async function createPeerConnection(
    destination
){

    debugLog(
        "🔗 CREANDO RTCPeerConnection"
    );


    remoteDescriptionSet =
        false;

    pendingIceCandidates =
        [];


    currentPeer =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });


    currentPeer.onicecandidate =
        async event => {

            if(
                !event.candidate
            ){

                return;
            }


            debugLog(
                "🧊 ICE LOCAL"
            );


            try{

                await sendSignal(
                    destination,
                    {

                        type:
                            "ice",

                        from:
                            myNumber,

                        to:
                            destination,

                        callId:
                            currentCall?.id,

                        candidate:
                            event.candidate
                    }
                );


            }catch(error){

                debugLog(
                    "❌ ERROR ICE:",
                    error?.message || error
                );
            }
        };


    currentPeer.ontrack =
        event => {

            debugLog(
                "🔊 AUDIO REMOTO RECIBIDO"
            );


            const audio =
                document.getElementById(
                    "remoteAudio"
                );


            if(
                event.streams?.[0]
            ){

                audio.srcObject =
                    event.streams[0];

            }else{

                if(
                    !audio.srcObject
                ){

                    audio.srcObject =
                        new MediaStream();
                }


                audio.srcObject.addTrack(
                    event.track
                );
            }


            audio.play()
                .then(
                    () => {

                        debugLog(
                            "🔊 AUDIO REPRODUCIÉNDOSE"
                        );


                        document.getElementById(
                            "audioButton"
                        ).style.display =
                            "none";
                    }
                )
                .catch(
                    error => {

                        debugLog(
                            "⚠️ AUTOPLAY BLOQUEADO:",
                            error?.message || error
                        );


                        document.getElementById(
                            "audioButton"
                        ).style.display =
                            "block";
                    }
                );
        };


    currentPeer.onconnectionstatechange =
        () => {

            debugLog(
                "🔗 CONNECTION:",
                currentPeer.connectionState
            );


            if(
                currentPeer.connectionState ===
                "connected"
            ){

                showActiveScreen();


                setActiveState(
                    "Conectado"
                );
            }


            if(
                currentPeer.connectionState ===
                "failed"
            ){

                setActiveState(
                    "Conexión fallida"
                );
            }


            if(
                currentPeer.connectionState ===
                "disconnected"
            ){

                setActiveState(
                    "Conexión perdida"
                );
            }
        };


    currentPeer.oniceconnectionstatechange =
        () => {

            debugLog(
                "🧊 ICE:",
                currentPeer.iceConnectionState
            );
        };
}


/* =========================================================
   AUDIO
========================================================= */

async function createLocalAudio(){

    if(localStream){

        return;
    }


    debugLog(
        "🎙️ SOLICITANDO MICRÓFONO..."
    );


    localStream =
        await navigator.mediaDevices
            .getUserMedia({

                audio:{
                    echoCancellation:
                        true,

                    noiseSuppression:
                        true,

                    autoGainControl:
                        true
                },

                video:
                    false
            });


    debugLog(
        "🎙️ MICRÓFONO CONCEDIDO"
    );


    localStream
        .getTracks()
        .forEach(
            track => {

                currentPeer.addTrack(
                    track,
                    localStream
                );
            }
        );
}


/* =========================================================
   LLAMADA ENTRANTE
========================================================= */

async function receiveIncomingCall(
    payload
){

    debugLog(
        "📞 LLAMADA ENTRANTE DE:",
        payload.from
    );


    if(currentCall){

        debugLog(
            "⚠️ YA HAY UNA LLAMADA ACTIVA"
        );


        try{

            await sendSignal(
                payload.from,
                {

                    type:
                        "reject",

                    from:
                        myNumber,

                    to:
                        payload.from,

                    callId:
                        payload.callId
                }
            );

        }catch(error){

            debugLog(
                "❌ ERROR RECHAZO:",
                error?.message || error
            );
        }


        return;
    }


    currentIncomingOffer =
        payload.offer;


    currentIncomingFrom =
        payload.from;


    currentCall = {

        id:
            payload.callId,

        from:
            payload.from,

        to:
            myNumber
    };


    document.getElementById(
        "incomingNumber"
    ).textContent =
        payload.from;


    document.getElementById(
        "incomingScreen"
    ).classList.add(
        "active"
    );
}


/* =========================================================
   ACEPTAR
========================================================= */

async function acceptCall(){

    if(
        !currentIncomingOffer ||
        !currentIncomingFrom
    ){

        return;
    }


    const from =
        currentIncomingFrom;


    try{

        debugLog(
            "📞 ACEPTANDO:",
            from
        );


        document.getElementById(
            "incomingScreen"
        ).classList.remove(
            "active"
        );


        showActiveScreen();


        await createPeerConnection(
            from
        );


        await createLocalAudio();


        await currentPeer
            .setRemoteDescription(
                new RTCSessionDescription(
                    currentIncomingOffer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        const answer =
            await currentPeer
                .createAnswer();


        await currentPeer
            .setLocalDescription(
                answer
            );


        await sendSignal(
            from,
            {

                type:
                    "answer",

                from:
                    myNumber,

                to:
                    from,

                callId:
                    currentCall.id,

                answer:
                    answer
            }
        );


        setActiveState(
            "Conectando audio..."
        );


        debugLog(
            "✅ ANSWER ENVIADO"
        );


    }catch(error){

        debugLog(
            "❌ ERROR ACEPTANDO:",
            error?.message || error
        );


        cleanupCall();
    }
}


/* =========================================================
   ANSWER
========================================================= */

async function handleAnswer(
    payload
){

    if(
        !currentPeer
    ){

        debugLog(
            "⚠️ ANSWER SIN PEER CONNECTION"
        );

        return;
    }


    try{

        await currentPeer
            .setRemoteDescription(
                new RTCSessionDescription(
                    payload.answer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        debugLog(
            "✅ REMOTE DESCRIPTION CONFIGURADA"
        );


        showActiveScreen();


        setActiveState(
            "Conectando audio..."
        );


    }catch(error){

        debugLog(
            "❌ ERROR ANSWER:",
            error?.message || error
        );
    }
}


/* =========================================================
   ICE REMOTO
========================================================= */

async function handleRemoteIce(
    payload
){

    const candidate =
        payload.candidate;


    if(
        !candidate
    ){

        return;
    }


    if(
        !currentPeer ||
        !remoteDescriptionSet
    ){

        debugLog(
            "🧊 ICE GUARDADO EN COLA"
        );


        pendingIceCandidates.push(
            candidate
        );


        return;
    }


    try{

        await currentPeer
            .addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );


        debugLog(
            "🧊 ICE REMOTO AÑADIDO"
        );


    }catch(error){

        debugLog(
            "❌ ERROR ICE REMOTO:",
            error?.message || error
        );
    }
}


/* =========================================================
   FLUSH ICE
========================================================= */

async function flushPendingIce(){

    if(
        !currentPeer ||
        !remoteDescriptionSet
    ){

        return;
    }


    if(
        pendingIceCandidates.length === 0
    ){

        return;
    }


    debugLog(
        "🧊 PROCESANDO ICE EN COLA:",
        pendingIceCandidates.length
    );


    const candidates =
        [...pendingIceCandidates];


    pendingIceCandidates =
        [];


    for(
        const candidate of candidates
    ){

        try{

            await currentPeer
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }catch(error){

            debugLog(
                "❌ ERROR ICE EN COLA:",
                error?.message || error
            );
        }
    }
}


/* =========================================================
   RECHAZAR
========================================================= */

async function rejectCall(){

    const from =
        currentIncomingFrom;


    try{

        if(from){

            await sendSignal(
                from,
                {

                    type:
                        "reject",

                    from:
                        myNumber,

                    to:
                        from,

                    callId:
                        currentCall?.id
                }
            );
        }


    }catch(error){

        debugLog(
            "❌ ERROR RECHAZANDO:",
            error?.message || error
        );


    }finally{

        cleanupCall();
    }
}


/* =========================================================
   COLGAR
========================================================= */

async function hangupCall(){

    const destination =
        currentCall?.from === myNumber
            ? currentCall?.to
            : currentCall?.from;


    try{

        if(destination){

            await sendSignal(
                destination,
                {

                    type:
                        "hangup",

                    from:
                        myNumber,

                    to:
                        destination,

                    callId:
                        currentCall?.id
                }
            );
        }


    }catch(error){

        debugLog(
            "❌ ERROR HANGUP:",
            error?.message || error
        );


    }finally{

        cleanupCall();
    }
}


/* =========================================================
   LIMPIAR
========================================================= */

function cleanupCall(){

    debugLog(
        "🧹 LIMPIANDO LLAMADA"
    );


    if(currentPeer){

        try{

            currentPeer.close();

        }catch{}
    }


    currentPeer =
        null;


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }


    localStream =
        null;


    const audio =
        document.getElementById(
            "remoteAudio"
        );


    audio.pause();

    audio.srcObject =
        null;


    pendingIceCandidates =
        [];


    remoteDescriptionSet =
        false;


    currentCall =
        null;


    currentIncomingOffer =
        null;


    currentIncomingFrom =
        null;


    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            screen =>
                screen.classList.remove(
                    "active"
                )
        );


    document.getElementById(
        "audioButton"
    ).style.display =
        "none";


    if(myNumber){

        setStatus(
            "ONLINE • " + myNumber,
            "#5de1ff"
        );
    }
}


/* =========================================================
   PANTALLAS
========================================================= */

function showOutgoingScreen(
    number
){

    document.getElementById(
        "outgoingNumber"
    ).textContent =
        number;


    document.getElementById(
        "outgoingState"
    ).textContent =
        "Preparando llamada...";


    document.getElementById(
        "outgoingScreen"
    ).classList.add(
        "active"
    );
}


function showOutgoingState(
    text
){

    document.getElementById(
        "outgoingState"
    ).textContent =
        text;
}


function showActiveScreen(){

    document.getElementById(
        "outgoingScreen"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "incomingScreen"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "activeNumber"
    ).textContent =
        currentCall?.from === myNumber
            ? currentCall?.to || "-----"
            : currentCall?.from || "-----";


    document.getElementById(
        "activeScreen"
    ).classList.add(
        "active"
    );
}


function setActiveState(
    text
){

    document.getElementById(
        "activeState"
    ).textContent =
        text;
}


/* =========================================================
   AUDIO MANUAL
========================================================= */

async function activateAudio(){

    const audio =
        document.getElementById(
            "remoteAudio"
        );


    try{

        await audio.play();


        document.getElementById(
            "audioButton"
        ).style.display =
            "none";


        setActiveState(
            "Audio activo"
        );


    }catch(error){

        debugLog(
            "❌ NO SE PUDO ACTIVAR AUDIO:",
            error?.message || error
        );
    }
}


/* =========================================================
   INIT
========================================================= */

async function init(){

    try{

        debugLog(
            "🚀 INICIANDO NEXUS"
        );


        await testSupabaseConnection();


        await createNexusUser();


        await setupMyChannel();


        debugLog(
            "✅ NEXUS LISTO:",
            myNumber
        );


    }catch(error){

        console.error(
            "NEXUS INIT ERROR:",
            error
        );


        debugLog(
            "❌ INIT:",
            error?.message || error,

            "STATUS:",
            error?.status ?? "N/A"
        );


        setStatus(
            "ERROR DE CONEXIÓN",
            "#ff6464"
        );
    }
}


/* =========================================================
   ARRANCAR
========================================================= */

window.addEventListener(
    "load",
    init
);

</script>
