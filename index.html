
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS CALL</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#17213b 0%,#080b12 45%,#030407 100%);
    color:white;
    display:flex;
    justify-content:center;

    overflow:hidden;
}

.app{
    width:min(430px,100%);
    min-height:100vh;
    background:rgba(5,8,15,.92);
    display:flex;
    flex-direction:column;

}

header{
    padding:24px 20px 18px;

}

.logo{
    font-size:27px;

}

.subtitle{
    color:#78839b;

}

.status{
    margin-top:14px;
    display:flex;
    align-items:center;

    font-size:13px;

}

.dot{
    width:9px;

    border-radius:50%;

}

.dot.online{
    background:#22d878;

}

main{
    flex:1;

.mybox{
    text-align:center;

}

.label{
    color:#78839b;

}

.my-number{

.copy{

    padding:9px 16px;

}

.dial{
    margin-top:25px;
}

.dial-display{
    width:100%;

    font-size:30px;

}

.keypad{
    display:grid;

    height:58px;
    border:none;
    border-radius:15px;
    background:#111827;
    color:white;
    font-size:22px;

}

.key:active{

}

    width:100%;
    margin-top:15px;

    border:0;
    border-radius:17px;
    background:#20d879;
    color:#03140b;
    font-size:17px;

}

    min-height:24px;

    color:#7f8ba4;
    font-size:12px;
    margin-top:15px;
}

.screen{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at center,#14213d,#05070b 65%);

    flex-direction:column;
    align-items:center;
    justify-content:center;

}

    display:flex;
}

.avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111b2d;
    border:1px solid rgba(255,255,255,.1);
    font-size:40px;
    box-shadow:0 0 45px rgba(40,120,255,.12);
}

.calling-label{
    margin-top:25px;
    color:#7f8ba4;
    font-size:12px;
    letter-spacing:2px;
}

.calling-number{
    margin-top:8px;
    font-size:38px;
    letter-spacing:6px;
    font-weight:800;
}

.call-state{
    margin-top:10px;
    color:#8d99b1;
}

.actions{
    display:flex;
    gap:22px;
    margin-top:40px;
}

.action{
    width:65px;
    height:65px;
    border:0;
    border-radius:50%;
    background:#172033;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.action.active{
    background:#ffffff;
    color:#111;
}

.hangup{
    background:#ed4141;
}

.incoming-title{
    font-size:13px;
    color:#8490a8;
    letter-spacing:3px;
}

.incoming-number{
    font-size:40px;
    font-weight:800;
    letter-spacing:6px;
    margin:10px 0;
}

.incoming-text{
    color:#8c97aa;
}

.incoming-actions{
    display:flex;
    gap:25px;
    margin-top:40px;
}

.incoming-btn{
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    font-size:27px;
    cursor:pointer;
}

.accept{
    background:#20d879;
}

.reject{
    background:#ed4141;
    color:white;
}

#audioUnlock{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:9999;
    padding:16px 25px;
    border:0;
    border-radius:14px;
    background:#20d879;
    color:#03140b;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
}

#errorBox{
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    max-width:410px;
    margin:auto;
    padding:10px;
    border-radius:10px;
    background:#2b1111;
    color:#ff9d9d;
    font-size:11px;
    display:none;
    z-index:10000;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://nrffcctjnesotfveaeky.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zI1_i95-Pe1VQT3ru0MurQ_Ysi6eY3S";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let myUserId = null;
let myNexusNumber = null;

let currentCallId = null;
let currentRemoteNumber = null;

let peerConnection = null;
let localStream = null;

let myChannel = null;

let incomingOffer = null;
let incomingCaller = null;

let isMuted = false;

let audioContext = null;
let ringtoneInterval = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const myNumberEl =
    document.getElementById("myNumber");

const dialInput =
    document.getElementById("dialInput");

const messageEl =
    document.getElementById("message");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const callScreen =
    document.getElementById("callScreen");

const incomingScreen =
    document.getElementById("incomingScreen");

const callingNumberEl =
    document.getElementById("callingNumber");

const callStateEl =
    document.getElementById("callState");

const incomingNumberEl =
    document.getElementById("incomingNumber");

const remoteAudio =
    document.getElementById("remoteAudio");


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    initializeNexus
);


/* =========================================================
   AUDIO
========================================================= */

document.addEventListener(
    "pointerdown",
    unlockAudio,
    {once:true}
);


async function unlockAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            await audioContext.resume();

        }

    }catch(error){

        console.warn(
            "AudioContext:",
            error
        );

    }

}


/* =========================================================
   INICIALIZAR
========================================================= */

async function initializeNexus(){

    try{

        setStatus(
            "Conectando...",
            false
        );


        let {
            data:sessionData
        } =
        await supabaseClient
            .auth
            .getSession();


        let session =
            sessionData.session;


        if(!session){

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInAnonymously();


            if(error){
                throw error;
            }


            session =
                data.session;

        }


        if(
            !session ||
            !session.user
        ){

            throw new Error(
                "No se pudo crear la identidad NEXUS."
            );

        }


        myUserId =
            session.user.id;


        const {
            data:userRow,
            error:userError
        } =
        await supabaseClient
            .from("nexus_users")
            .select("*")
            .eq("id",myUserId)
            .maybeSingle();


        if(userError){
            throw userError;
        }


        if(userRow){

            myNexusNumber =
                String(
                    userRow.nexus_number
                ).padStart(5,"0");

        }else{

            myNexusNumber =
                await createNexusNumber();

        }


        myNumberEl.textContent =
            myNexusNumber;


        await updateOnlineStatus(true);

        await setupMyChannel();


        setStatus(
            "NEXUS conectado",
            true
        );


        setMessage(
            "Tu número está listo."
        );


        window.addEventListener(
            "beforeunload",
            () => {
                updateOnlineStatus(false);
            }
        );


    }catch(error){

        console.error(error);

        setStatus(
            "Error de conexión",
            false
        );

        showError(
            error.message ||
            "No se pudo iniciar NEXUS."
        );

    }

}


/* =========================================================
   NÚMERO NEXUS
========================================================= */

async function createNexusNumber(){

    for(
        let attempt = 0;
        attempt < 30;
        attempt++
    ){

        const number =
            String(
                Math.floor(
                    10000 +
                    Math.random() * 90000
                )
            );


        const {
            data,
            error
        } =
        await supabaseClient
            .from("nexus_users")
            .insert({

                id:myUserId,

                nexus_number:number,

                online:true,

                last_seen:
                    new Date()
                    .toISOString()

            })
            .select()
            .single();


        if(!error && data){

            return number;

        }


        if(
            error &&
            !String(error.message)
                .toLowerCase()
                .includes("duplicate")
        ){

            throw error;

        }

    }


    throw new Error(
        "No se pudo generar un número NEXUS."
    );

}


/* =========================================================
   ONLINE
========================================================= */

async function updateOnlineStatus(
    online
){

    if(!myUserId){
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("nexus_users")
        .update({

            online:online,

            last_seen:
                new Date()
                .toISOString()

        })
        .eq(
            "id",
            myUserId
        );


    if(error){

        console.warn(
            "Estado:",
            error.message
        );

    }

}


/* =========================================================
   CANAL PERSONAL
========================================================= */

async function setupMyChannel(){

    myChannel =
        supabaseClient.channel(
            "nexus:" +
            myNexusNumber
        );


    myChannel.on(
        "broadcast",
        {
            event:"signal"
        },
        async ({payload}) => {

            try{

                await handleSignal(
                    payload
                );

            }catch(error){

                console.error(
                    "Signal:",
                    error
                );

            }

        }
    );


    return new Promise(
        (resolve,reject) => {

            myChannel.subscribe(
                status => {

                    console.log(
                        "NEXUS CHANNEL:",
                        status
                    );


                    if(
                        status ===
                        "SUBSCRIBED"
                    ){

                        resolve();

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ){

                        reject(
                            new Error(
                                "Error conectando Realtime."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   ENVIAR SEÑAL
========================================================= */

async function sendSignal(
    destination,
    payload
){

    const channel =
        supabaseClient.channel(
            "nexus:" +
            destination
        );


    return new Promise(
        (resolve,reject) => {

            let finished = false;


            const finish = (
                error
            ) => {

                if(finished){
                    return;
                }

                finished = true;

                if(error){
                    reject(error);
                }else{
                    resolve();
                }

            };


            channel.subscribe(
                async status => {

                    if(
                        status ===
                        "SUBSCRIBED"
                    ){

                        try{

                            const result =
                                await channel.send({

                                    type:
                                        "broadcast",

                                    event:
                                        "signal",

                                    payload:
                                        payload

                                });


                            await supabaseClient
                                .removeChannel(
                                    channel
                                );


                            finish(
                                result
                            );

                        }catch(error){

                            try{

                                await supabaseClient
                                    .removeChannel(
                                        channel
                                    );

                            }catch(e){}


                            finish(error);

                        }

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ){

                        finish(
                            new Error(
                                "No se pudo enviar la señal."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   ID DE LLAMADA
========================================================= */

function createCallId(){

    return (
        Date.now()
            .toString(36) +

        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =========================================================
   LLAMAR
========================================================= */

async function startCall(){

    await unlockAudio();


    const target =
        dialInput.value.trim();


    if(!/^\d{5}$/.test(target)){

        setMessage(
            "Introduce exactamente 5 dígitos."
        );

        return;

    }


    if(
        target ===
        myNexusNumber
    ){

        setMessage(
            "No puedes llamarte a ti mismo."
        );

        return;

    }


    try{

        const {
            data:user,
            error
        } =
        await supabaseClient
            .from("nexus_users")
            .select(
                "nexus_number,online"
            )
            .eq(
                "nexus_number",
                target
            )
            .maybeSingle();


        if(error){
            throw error;
        }


        if(!user){

            setMessage(
                "El número " +
                target +
                " no existe."
            );

            return;

        }


        currentRemoteNumber =
            target;

        currentCallId =
            createCallId();


        showCallScreen(
            target,
            "Solicitando micrófono..."
        );


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    },

                    video:false

                });


        await createPeerConnection(
            target
        );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await sendSignal(
            target,
            {

                type:"incoming_call",

                callId:
                    currentCallId,

                from:
                    myNexusNumber,

                to:
                    target,

                offer:
                    offer

            }
        );


        callStateEl.textContent =
            "Esperando respuesta...";


    }catch(error){

        console.error(error);

        closeCall();

        showError(
            error.message ||
            "No se pudo iniciar la llamada."
        );

    }

}


/* =========================================================
   WEBRTC
========================================================= */

async function createPeerConnection(
    remoteNumber
){

    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

    }


    peerConnection =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                    "stun:stun1.l.google.com:19302"
                }

            ]

        });


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    /*
     * AUDIO REMOTO
     */

    peerConnection.ontrack =
        async event => {

            console.log(
                "🎧 AUDIO REMOTO:",
                event.streams
            );


            const stream =
                event.streams &&
                event.streams[0];


            if(!stream){

                console.warn(
                    "No llegó stream remoto."
                );

                return;

            }


            remoteAudio.srcObject =
                stream;


            try{

                await remoteAudio.play();


                console.log(
                    "🔊 AUDIO REPRODUCIÉNDOSE"
                );


                callStateEl.textContent =
                    "🟢 Audio conectado";


            }catch(error){

                console.warn(
                    "Autoplay bloqueado:",
                    error
                );


                showAudioUnlock();

            }

        };


    /*
     * ICE
     */

    peerConnection.onicecandidate =
        async event => {

            if(
                event.candidate &&
                currentCallId
            ){

                try{

                    await sendSignal(
                        remoteNumber,
                        {

                            type:"ice",

                            callId:
                                currentCallId,

                            from:
                                myNexusNumber,

                            to:
                                remoteNumber,

                            candidate:
                                event.candidate

                        }
                    );

                }catch(error){

                    console.error(
                        "ICE:",
                        error
                    );

                }

            }

        };


    /*
     * CONEXIÓN
     */

    peerConnection
        .onconnectionstatechange =
        () => {

            if(!peerConnection){
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            console.log(
                "WEBRTC:",
                state
            );


            if(
                state ===
                "connecting"
            ){

                callStateEl.textContent =
                    "Conectando audio...";

            }


            if(
                state ===
                "connected"
            ){

                callStateEl.textContent =
                    "🟢 Conectado";

            }


            if(
                state ===
                "disconnected"
            ){

                callStateEl.textContent =
                    "⚠️ Conexión perdida";

            }


            if(
                state ===
                "failed"
            ){

                callStateEl.textContent =
                    "❌ WebRTC no pudo conectar";

            }

        };


    /*
     * ICE STATE
     */

    peerConnection
        .oniceconnectionstatechange =
        () => {

            console.log(
                "ICE STATE:",
                peerConnection
                    .iceConnectionState
            );

        };

}


/* =========================================================
   SEÑALES
========================================================= */

async function handleSignal(
    payload
){

    if(!payload){
        return;
    }


    if(
        payload.to &&
        payload.to !==
        myNexusNumber
    ){

        return;

    }


    /*
     * LLAMADA ENTRANTE
     */

    if(
        payload.type ===
        "incoming_call"
    ){

        if(currentCallId){
            return;
        }


        incomingOffer =
            payload.offer;

        incomingCaller =
            payload.from;

        currentCallId =
            payload.callId;

        currentRemoteNumber =
            payload.from;


        incomingNumberEl.textContent =
            payload.from;


        incomingScreen
            .classList
            .add("show");


        startRingtone();

        return;

    }


    /*
     * ANSWER
     */

    if(
        payload.type ===
        "answer"
    ){

        if(
            !peerConnection ||
            payload.callId !==
            currentCallId
        ){

            return;

        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    payload.answer
                )
            );


        callStateEl.textContent =
            "Conectando audio...";


        return;

    }


    /*
     * ICE
     */

    if(
        payload.type ===
        "ice"
    ){

        if(
            !peerConnection ||
            payload.callId !==
            currentCallId
        ){

            return;

        }


        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        payload.candidate
                    )
                );

        }catch(error){

            console.warn(
                "ICE candidate:",
                error
            );

        }


        return;

    }


    /*
     * RECHAZO
     */

    if(
        payload.type ===
        "reject"
    ){

        if(
            payload.callId !==
            currentCallId
        ){

            return;

        }


        callStateEl.textContent =
            "Llamada rechazada";


        setTimeout(
            closeCall,
            1000
        );


        return;

    }


    /*
     * COLGAR
     */

    if(
        payload.type ===
        "hangup"
    ){

        if(
            payload.callId !==
            currentCallId
        ){

            return;

        }


        closeCall();

    }

}


/* =========================================================
   ACEPTAR
========================================================= */

async function acceptIncoming(){

    await unlockAudio();

    stopRingtone();


    if(
        !incomingOffer ||
        !incomingCaller
    ){

        rejectIncoming();

        return;

    }


    incomingScreen
        .classList
        .remove("show");


    showCallScreen(
        incomingCaller,
        "Solicitando micrófono..."
    );


    try{

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    },

                    video:false

                });


        await createPeerConnection(
            incomingCaller
        );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingOffer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendSignal(
            incomingCaller,
            {

                type:"answer",

                callId:
                    currentCallId,

                from:
                    myNexusNumber,

                to:
                    incomingCaller,

                answer:
                    answer

            }
        );


        callStateEl.textContent =
            "Conectando audio...";


        incomingOffer = null;
        incomingCaller = null;


    }catch(error){

        console.error(error);

        closeCall();

        showError(
            error.message ||
            "No se pudo aceptar la llamada."
        );

    }

}


/* =========================================================
   RECHAZAR
========================================================= */

async function rejectIncoming(){

    stopRingtone();


    if(
        incomingCaller &&
        currentCallId
    ){

        try{

            await sendSignal(
                incomingCaller,
                {

                    type:"reject",

                    callId:
                        currentCallId,

                    from:
                        myNexusNumber,

                    to:
                        incomingCaller

                }
            );

        }catch(e){}

    }


    incomingOffer = null;
    incomingCaller = null;
    currentCallId = null;
    currentRemoteNumber = null;


    incomingScreen
        .classList
        .remove("show");

}


/* =========================================================
   COLGAR
========================================================= */

async function hangUp(){

    if(
        currentRemoteNumber &&
        currentCallId
    ){

        try{

            await sendSignal(
                currentRemoteNumber,
                {

                    type:"hangup",

                    callId:
                        currentCallId,

                    from:
                        myNexusNumber,

                    to:
                        currentRemoteNumber

                }
            );

        }catch(e){}

    }


    closeCall();

}


/* =========================================================
   CERRAR
========================================================= */

function closeCall(){

    stopRingtone();


    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

        peerConnection = null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {
                    track.stop();
                }
            );

        localStream = null;

    }


    remoteAudio.pause();

    remoteAudio.srcObject =
        null;


    callScreen
        .classList
        .remove("show");


    incomingScreen
        .classList
        .remove("show");


    currentCallId = null;
    currentRemoteNumber = null;

    incomingOffer = null;
    incomingCaller = null;

    isMuted = false;


    document
        .getElementById("muteBtn")
        .classList
        .remove("active");


    const unlock =
        document.getElementById(
            "audioUnlock"
        );


    if(unlock){
        unlock.remove();
    }

}


/* =========================================================
   SILENCIAR
========================================================= */

function toggleMute(){

    if(!localStream){
        return;
    }


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    document
        .getElementById("muteBtn")
        .classList
        .toggle(
            "active",
            isMuted
        );

}


/* =========================================================
   TONO
========================================================= */

function startRingtone(){

    stopRingtone();

    unlockAudio();


    if(!audioContext){
        return;
    }


    let playing = false;


    function beep(){

        if(playing){
            return;
        }


        playing = true;


        try{

            const oscillator =
                audioContext
                    .createOscillator();


            const gain =
                audioContext
                    .createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.value =
                780;


            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );


            gain.gain
                .exponentialRampToValueAtTime(
                    0.16,
                    audioContext.currentTime +
                    0.03
                );


            gain.gain
                .exponentialRampToValueAtTime(
                    0.0001,
                    audioContext.currentTime +
                    0.7
                );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start();


            oscillator.stop(
                audioContext.currentTime +
                0.7
            );


            oscillator.onended =
                () => {
                    playing = false;
                };


        }catch(error){

            playing = false;

        }

    }


    beep();


    ringtoneInterval =
        setInterval(
            beep,
            1800
        );

}


function stopRingtone(){

    if(ringtoneInterval){

        clearInterval(
            ringtoneInterval
        );

        ringtoneInterval = null;

    }

}


/* =========================================================
   ACTIVAR AUDIO
========================================================= */

function showAudioUnlock(){

    if(
        document.getElementById(
            "audioUnlock"
        )
    ){

        return;

    }


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "audioUnlock";


    button.textContent =
        "🔊 ACTIVAR AUDIO";


    button.onclick =
        async () => {

            try{

                await unlockAudio();

                await remoteAudio.play();


                button.remove();


                callStateEl.textContent =
                    "🟢 Audio conectado";


            }catch(error){

                console.error(
                    "Audio:",
                    error
                );

            }

        };


    document.body.appendChild(
        button
    );

}


/* =========================================================
   TECLADO
========================================================= */

function pressKey(number){

    if(
        dialInput.value.length >= 5
    ){

        return;

    }


    dialInput.value +=
        number;

}


function backspace(){

    dialInput.value =
        dialInput.value.slice(
            0,
            -1
        );

}


function clearDial(){

    dialInput.value =
        "";

}


/* =========================================================
   COPIAR
========================================================= */

async function copyMyNumber(){

    try{

        await navigator.clipboard.writeText(
            myNexusNumber
        );


        setMessage(
            "Número copiado."
        );


    }catch(error){

        setMessage(
            "No se pudo copiar."
        );

    }

}


/* =========================================================
   UI
========================================================= */

function showCallScreen(
    number,
    state
){

    callingNumberEl.textContent =
        number;

    callStateEl.textContent =
        state;

    callScreen
        .classList
        .add("show");

}


function setMessage(text){

    messageEl.textContent =
        text;

}


function setStatus(
    text,
    online
){

    statusText.textContent =
        text;

    statusDot.classList.toggle(
        "online",
        online
    );

}


function showError(text){

    const box =
        document.getElementById(
            "errorBox"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        6000
    );

}


/* =========================================================
   TECLADO FÍSICO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key >= "0" &&
            event.key <= "9"
        ){

            pressKey(
                event.key
            );

        }


        if(
            event.key ===
            "Backspace"
        ){

            backspace();

        }


        if(
            event.key ===
            "Enter"
        ){

            startCall();

        }

    }
);

</script>
